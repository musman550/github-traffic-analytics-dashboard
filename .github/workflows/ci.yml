name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "config/**", "scripts/**", ".github/**", "requirements.txt"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt html5lib
      - run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Audit committed site
        run: python scripts/audit_site.py docs

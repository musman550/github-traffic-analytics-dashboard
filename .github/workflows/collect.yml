name: Collect GitHub traffic

on:
  schedule:
    - cron: "17 2 * * *"   # daily incremental run
    - cron: "47 3 * * 0"   # weekly full refresh (every repository)
  workflow_dispatch:
    inputs:
      force_full:
        description: "Fetch traffic for every repository now"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt html5lib
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests
      - name: Collect, aggregate, render
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          PYTHONPATH: src
          FORCE_FULL: ${{ github.event.schedule == '47 3 * * 0' || inputs.force_full }}
        run: python -m ghintel.cli all
      - name: Host-root files (robots.txt, llms.txt, sitemap) for the github.io domain
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          PYTHONPATH: src
        run: python -m ghintel.cli rootsite || true
      - name: Alerts (failed runs, spikes, finished weekly reports)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: src
        run: python -m ghintel.cli alerts || true
      - name: Audit generated site (blocks publishing if broken)
        run: python scripts/audit_site.py docs
      - name: Commit data
        run: |
          git config user.name "traffic-bot"
          git config user.email "traffic-bot@users.noreply.github.com"
          git add -A docs CHANGELOG.md
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git pull --rebase --autostash -q
          git push
      - name: Open an alert issue if this workflow failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh issue create --repo "${{ github.repository }}" --label alert             --title "Collection workflow failed on $(date -u +%F)"             --body "The scheduled collection failed. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. A common cause is an expired GH_PAT token." || true
      - name: Notify search engines (IndexNow, best effort)
        run: |
          sleep 90
          python scripts/indexnow.py || true

name: Collect GitHub traffic

on:
  schedule:
    - cron: "17 2 * * *"   # daily incremental run
    - cron: "47 3 * * 0"   # weekly full refresh (every repo)
  workflow_dispatch:
    inputs:
      force_full:
        description: "Fetch traffic for every repository now"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests
      - name: Collect, aggregate, render
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          PYTHONPATH: src
          FORCE_FULL: ${{ github.event.schedule == '47 3 * * 0' || inputs.force_full }}
        run: python -m ghintel.cli all
      - name: Commit data
        run: |
          git config user.name "traffic-bot"
          git config user.email "traffic-bot@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git pull --rebase -q
          git push

name: Optimize repositories (AI)

on:
  schedule:
    - cron: "23 4 * * 1,4"   # Monday and Thursday
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: propose and log only, change nothing"
        type: boolean
        default: true
      limit:
        description: "Maximum repositories this run (blank = config default)"
        type: string
        default: ""
      repo:
        description: "Only this repository name (blank = automatic selection)"
        type: string
        default: ""
      rules_only:
        description: "Skip AI and use the rule-based fallback only"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt html5lib
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests
      - name: Optimize
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPT_DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          OPT_LIMIT: ${{ inputs.limit }}
          OPT_REPO: ${{ inputs.repo }}
          OPT_RULES_ONLY: ${{ inputs.rules_only }}
          PYTHONPATH: src
        run: python -m ghintel.cli optimize
      - name: Rebuild site and alerts
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: src
        run: |
          python -m ghintel.cli build
          python -m ghintel.cli alerts || true
      - name: Audit generated site (blocks publishing if broken)
        run: python scripts/audit_site.py docs
      - name: Commit data
        run: |
          git config user.name "traffic-bot"
          git config user.email "traffic-bot@users.noreply.github.com"
          git add -A docs CHANGELOG.md
          git diff --cached --quiet || git commit -m "optimizer: $(date -u +%F)"
          git pull --rebase --autostash -q
          git push
      - name: Open an alert issue if this workflow failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh issue create --repo "${{ github.repository }}" --label alert \
            --title "Optimizer workflow failed on $(date -u +%F)" \
            --body "See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}." || true
